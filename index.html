<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản lý Bot (qua GitHub)</title>
<style>
:root{--nen:#f4f6f9;--the:#fff;--chu:#1d2433;--mo:#6b7487;--vien:#e3e7ee;--xanh:#1f7a4d;--xanh-nhat:#e6f4ec;--do:#b42318;--do-nhat:#fdecea;--vang:#a15c00;--vang-nhat:#fff4e0;--chinh:#2457c5;--chinh-nhat:#e8eefb}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--nen);color:var(--chu)}
header{background:var(--the);border-bottom:1px solid var(--vien);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
.cham{width:10px;height:10px;border-radius:50%;display:inline-block;background:#aab}
.cham.on{background:#22a35a}.cham.off{background:#d03b2f}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit;color:var(--mo)}
nav button.chon{background:var(--chinh-nhat);color:var(--chinh);font-weight:600}
.phai{margin-left:auto;display:flex;gap:8px;align-items:center}
main{padding:18px;max-width:1280px;margin:0 auto}
.luoi{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:10px;padding:14px 16px}
.the h3{margin:0 0 8px;font-size:13px;color:var(--mo);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.so{font-size:26px;font-weight:700}
.nho{color:var(--mo);font-size:12.5px}
.thanh{height:9px;background:#edf0f5;border-radius:5px;overflow:hidden;margin:6px 0}
.thanh i{display:block;height:100%;background:var(--xanh)}
.thanh i.vang{background:#e0a100}.thanh i.do{background:var(--do)}
.bao{padding:9px 12px;border-radius:8px;margin-bottom:8px;background:var(--vang-nhat);color:var(--vang);border:1px solid #f3d9a8}
.bao.do{background:var(--do-nhat);color:var(--do);border-color:#f3c1bb}
.bao.xanh{background:var(--xanh-nhat);color:var(--xanh);border-color:#b9e0c9}
button.nut,a.nut{border:1px solid var(--vien);background:var(--the);padding:7px 13px;border-radius:7px;cursor:pointer;font:inherit;color:var(--chu);text-decoration:none;display:inline-block}
button.nut:hover{border-color:#b9c2d3}
.nut.chinh{background:var(--chinh);border-color:var(--chinh);color:#fff}
.nut.do{color:var(--do);border-color:#f0b8b1}
.nut.nho{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;background:var(--the)}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--vien);vertical-align:middle}
th{font-size:12px;color:var(--mo);font-weight:600;background:#fafbfd;position:sticky;top:0}
tr:hover td{background:#fafcff}
.bang{border:1px solid var(--vien);border-radius:10px;overflow:auto;max-height:70vh}
input[type=text],input[type=password],input[type=search],select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--vien);border-radius:6px;background:#fff;color:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--chinh-nhat);border-color:var(--chinh)}
.the-chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef1f6;color:var(--mo);margin:1px 2px 1px 0;white-space:nowrap}
.the-chip.xanh{background:var(--xanh-nhat);color:var(--xanh)}.the-chip.do{background:var(--do-nhat);color:var(--do)}.the-chip.chinh{background:var(--chinh-nhat);color:var(--chinh)}.the-chip.vang{background:var(--vang-nhat);color:var(--vang)}
.thanh-cong{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.thanh-cong input[type=search]{max-width:280px}
.ma{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--mo)}
.log{background:#11161f;color:#d6dbe4;font:12px/1.45 ui-monospace,Consolas,monospace;padding:12px;border-radius:10px;height:65vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .error{color:#ff8b80}.log .warn{color:#ffd27a}.log .t{color:#7d8799}
.form-nhom{margin-bottom:18px}
.form-nhom h4{margin:0 0 8px;font-size:14px}
.dong-bien{display:grid;grid-template-columns:minmax(180px,260px) 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--vien)}
.bang-bm td{vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--vien);font-size:13.5px}.bang-bm td:first-child{white-space:nowrap;width:150px}
.dong-bien .k{font-weight:600;font-size:13px}.dong-bien .k small{display:block;font-weight:400;color:var(--mo)}
#thongbao{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:20}
#thongbao div{background:#1d2433;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:380px}
#thongbao div.loi{background:var(--do)}
.an{display:none!important}
#dangnhap{max-width:360px;margin:12vh auto}
.goi-y{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
@media (max-width:700px){.dong-bien{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<div id="dangnhap" class="the an">
  <h2 style="margin-top:0">Quản lý Bot Zalo</h2>
  <p class="nho" id="dn-ghi">Nhập mật khẩu trang quản lý.</p>
  <form id="dn-form"><div id="dn-gh" class="an"><input type="text" id="dn-khoa" placeholder="Khoá trang: xxxx-xxxx-xxxx-xxxx" autocomplete="off" spellcheck="false" autocapitalize="off">
  <label class="nho" style="display:block;margin:4px 0 8px"><input type="checkbox" id="dn-nho"> nhớ khoá trang trên máy này</label></div>
  <input type="password" id="dn-mk" placeholder="Mật khẩu" autocomplete="current-password" autofocus>
  <input type="text" id="dn-ma" class="an" placeholder="Mã 6 số trong Google Authenticator" inputmode="numeric" autocomplete="one-time-code" maxlength="7" style="margin-top:8px;font-size:18px;letter-spacing:4px;text-align:center">
  <p><button class="nut chinh" style="width:100%">Đăng nhập</button></p></form>
  <p class="nho" id="dn-loi" style="color:var(--do)"></p>
</div>

<div id="app" class="an">
<header>
  <h1>🤖 Quản lý Bot</h1>
  <span><span class="cham" id="h-cham"></span> <span id="h-tt">…</span></span>
  <nav id="tabs"></nav>
  <div class="phai">
    <button class="nut" id="h-tamdung"></button>
    <button class="nut" id="h-kdl">Khởi động lại</button>
    <button class="nut nho" id="h-thoat">Đăng xuất</button>
  </div>
</header>
<main>
  <section data-tab="tong"></section>
  <section data-tab="nap"></section>
  <section data-tab="tk"></section>
  <section data-tab="nguoi"></section>
  <section data-tab="nhom"></section>
  <section data-tab="gui"></section>
  <section data-tab="cai"></section>
  <section data-tab="log"></section>
  <section data-tab="luu"></section>
</main>
</div>
<div id="thongbao"></div>

<script src="cua-gh.js"></script>
<script>
const TABS_CHU = [["tong", "Tổng quan"], ["nap", "Nạp dữ liệu"], ["nguoi", "Người dùng"], ["nhom", "Nhóm"], ["gui", "Gửi tin"], ["tk", "Tài khoản"], ["cai", "Cài đặt"], ["log", "Nhật ký"], ["luu", "Bảo mật & sao lưu"]];
const TABS_NHAP = [["nap", "Nạp dữ liệu"]];
let VAI = null, TEN = "";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tg = (ms) => { if (!ms) return "—"; const d = (Date.now() - ms) / 1000; if (d < 60) return "vừa xong"; if (d < 3600) return Math.floor(d / 60) + " phút trước"; if (d < 86400) return Math.floor(d / 3600) + " giờ trước"; return Math.floor(d / 86400) + " ngày trước"; };
const phut = (m) => m == null ? "—" : m < 60 ? m + " phút" : m < 1440 ? Math.floor(m / 60) + " giờ " + (m % 60) + " phút" : Math.floor(m / 1440) + " ngày " + Math.floor((m % 1440) / 60) + " giờ";
let D = null, tab = location.hash.slice(1) || "tong", dangSua = false, hen = null;

function bao(msg, loi = false) {
  const d = document.createElement("div"); d.textContent = msg; if (loi) d.className = "loi";
  $("#thongbao").append(d); setTimeout(() => d.remove(), loi ? 7000 : 3500);
}
async function api(p, body) {
  if (window.GH) {                                     // trang GitHub (cua-gh.js): lệnh đi qua hộp thư
    const j = await GH.api(p, body);
    if (j?.can_dang_nhap) { hienDangNhap("Hết phiên — đăng nhập lại"); throw new Error("Cần đăng nhập"); }
    if (j?.loi) throw new Error(j.loi);
    return j;
  }
  const r = await fetch("/quan-ly/api/" + p, body === undefined ? { credentials: "same-origin" } :
    { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json", "x-ql": "1" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ loi: "HTTP " + r.status }));
  if (r.status === 401 && j.can_dang_nhap) { hienDangNhap(); throw new Error("Cần đăng nhập"); }
  if (!r.ok) throw new Error(j.loi || "HTTP " + r.status);
  return j;
}
async function lam(fn, ok) { try { const r = await fn(); if (ok) bao(ok); await tai(); return r; } catch (e) { bao(e.message, true); } }

function hienDangNhap(ghi) {
  clearInterval(hen); D = null; VAI = null;
  for (const s of document.querySelectorAll("main section")) s.innerHTML = "";
  $("#app").classList.add("an"); $("#dangnhap").classList.remove("an");
  if (ghi) $("#dn-ghi").textContent = ghi;
}
$("#dn-form").onsubmit = async (e) => {
  e.preventDefault(); $("#dn-loi").textContent = "";
  if (window.GH) {
    const nut = $("#dn-form button"); nut.disabled = true;
    try {
      const j = await GH.dangNhap($("#dn-khoa").value, $("#dn-mk").value, $("#dn-ma").value, (m) => ($("#dn-loi").textContent = m));
      if (j.can_ma) { $("#dn-ma").classList.remove("an"); $("#dn-ma").value = ""; $("#dn-ma").focus(); $("#dn-loi").textContent = j.loi; return; }
      $("#dn-mk").value = ""; $("#dn-ma").value = ""; $("#dn-ma").classList.add("an"); $("#dn-loi").textContent = ""; VAI = j.vai; TEN = j.ten; return batDau();
    } catch (e2) { $("#dn-loi").textContent = "❌ " + e2.message; } finally { nut.disabled = false; }
    return;
  }
  const r = await fetch("/quan-ly/api/dang-nhap", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ mat_khau: $("#dn-mk").value, ma: $("#dn-ma").value }) });
  const j = await r.json().catch(() => ({}));
  if (r.ok) { $("#dn-mk").value = ""; $("#dn-ma").value = ""; $("#dn-ma").classList.add("an"); VAI = j.vai; TEN = j.ten; return batDau(); }
  if (j.can_ma) { $("#dn-ma").classList.remove("an"); $("#dn-ma").value = ""; $("#dn-ma").focus(); }
  $("#dn-loi").textContent = j.loi || "Lỗi " + r.status;
};
$("#h-thoat").onclick = async () => { await api("dang-xuat", {}).catch(() => {}); hienDangNhap(); };
$("#h-tamdung").onclick = () => lam(() => api("tam-dung", { bat: !D.tam_dung }), D.tam_dung ? "Bot trả lời lại bình thường" : "Đã tạm dừng: bot chỉ trả lời chủ bot");
$("#h-kdl").onclick = async () => {
  if (!confirm("Khởi động lại bot? Bot im khoảng 1 phút (Render deploy: ~3 phút).")) return;
  try { const r = await api("khoi-dong-lai", {}); bao(`Đang khởi động lại… chờ ~${r.cho_giay} giây`); setTimeout(tai, r.cho_giay * 1000); } catch (e) { bao(e.message, true); }
};

$("#tabs").onclick = (e) => { const k = e.target.dataset.k; if (k) { tab = k; dangSua = false; location.hash = k; ve(); } };

// ================= VẼ =================
function ve() {
  for (const b of $("#tabs").children) b.classList.toggle("chon", b.dataset.k === tab);
  for (const s of document.querySelectorAll("main section")) s.classList.toggle("an", s.dataset.tab !== tab);
  if (!D) return;
  if (VAI !== "chu") { $("#h-tt").textContent = TEN + " · nhập số liệu"; $("#h-cham").className = "cham on"; return veNap(); }
  const b = D.bot;
  $("#h-cham").className = "cham " + (b.zalo ? "on" : "off");
  $("#h-tt").textContent = b.zalo ? "Đang chạy" : "Mất kết nối Zalo";
  $("#h-tamdung").textContent = D.tam_dung ? "▶ Tiếp tục trả lời" : "⏸ Tạm dừng";
  $("#h-tamdung").classList.toggle("do", D.tam_dung);
  $("#h-kdl").classList.toggle("chinh", D.can_khoi_dong_lai.length > 0);
  if (dangSua && ["nguoi", "nhom", "cai", "gui", "nap", "tk", "luu"].includes(tab)) return;   // đang gõ: không vẽ lại đè chữ
  ({ tong: veTong, nap: veNap, nguoi: veNguoi, nhom: veNhom, gui: veGui, tk: veTk, cai: veCai, log: veLog, luu: veLuu })[tab]();
}

function veTong() {
  const b = D.bot, n = b.nhip || {};
  const ngay = new Date(), ngayThang = ngay.getDate(), soNgay = new Date(ngay.getFullYear(), ngay.getMonth() + 1, 0).getDate();
  const botThe = (b.bots || []).map((x) => {
    const pct = Math.min(100, x.tin_thang / 30), du = Math.round(x.tin_thang / Math.max(1, ngayThang) * soNgay);
    const mau = x.het_han_muc || pct > 85 ? "do" : pct > 60 ? "vang" : "";
    const soNhom = D.nhom.filter((g) => g.bot === x.so && ["san", "bat"].includes(g.trang_thai)).length, soNguoi = D.nguoi.filter((p) => p.bot === x.so).length;
    return `<div class="the"><h3>Bot ${x.so} — ${esc(x.ten || x.account_name)} ${x.ket_noi === false ? chip("mất kết nối", "do") : chip("đang chạy", "xanh")}</h3>
      <div class="so">${x.tin_thang.toLocaleString("vi")} <span class="nho">/ 3.000 tin tháng ${esc(String(b.thang || "").slice(5))}</span></div>
      <div class="thanh"><i class="${mau}" style="width:${pct}%"></i></div>
      <div class="nho">${x.het_han_muc ? `<b style="color:var(--do)">Zalo báo HẾT hạn mức</b> ${tg(x.het_info?.luc)}${x.het_info?.loi ? ` (${esc(x.het_info.loi)})` : ""}` : `Dự báo cuối tháng ≈ <b>${du.toLocaleString("vi")}</b> tin ${du > 3000 ? "<b style='color:var(--do)'>(VƯỢT)</b>" : ""}`}<br>${soNhom}/3 nhóm đang bật · ${soNguoi}/50 người · <a href="#nguoi" class="loc-bot" data-bot="${x.so}">xem</a></div></div>`;
  }).join("");
  const nguoi = D.nguoi.length, nhomBat = D.nhom.filter((g) => ["san", "bat"].includes(g.trang_thai)).length;
  const moi = D.nhom.filter((g) => g.trang_thai === "chua");
  const top = [...D.nguoi].sort((a, b) => b.so_tin - a.so_tin).slice(0, 6);
  $('[data-tab=tong]').innerHTML = `
    ${D.canh_bao.map((c) => `<div class="bao ${/MẤT|HẾT|lỗi/i.test(c) ? "do" : ""}">⚠ ${esc(c)}</div>`).join("")}
    ${D.tam_dung ? `<div class="bao do">⏸ Bot đang TẠM DỪNG — chỉ trả lời chủ bot.</div>` : ""}
    ${moi.length ? `<div class="bao xanh">🆕 ${moi.length} nhóm mới đã tag bot nhưng chưa bật — vào tab <b>Nhóm</b> để bật.</div>` : ""}
    <div class="luoi">
      <div class="the"><h3>Trạng thái</h3>
        <div class="so" style="color:${b.zalo ? "var(--xanh)" : "var(--do)"}">${b.zalo ? "● Đang chạy" : "● Mất kết nối"}</div>
        <div class="nho">Chạy liên tục: <b>${phut(b.uptime_min)}</b><br>Nơi chạy: <b>${D.moi_truong === "render" ? "Render (máy chủ)" : "Máy tính"}</b>${b.ban ? ` · bản ${esc(b.ban)}` : ""}<br>RAM: ${b.ram_mb} MB${D.moi_truong === "render" ? " / 512" : ""}</div></div>
      ${botThe}
      <div class="the"><h3>Nhịp gửi tin</h3><div class="so">${n.ngay_24h ?? 0} <span class="nho">tin / 24 giờ</span></div>
        <div class="nho">1 giờ qua: <b>${n.gio ?? 0}</b> · phút này: <b>${n.phut ?? 0}</b> · đông nhất: ${n.max_1_phut ?? 0}/phút<br>Đang chờ gửi: ${n.hang_doi ?? 0}</div></div>
      <div class="the"><h3>Danh bạ</h3><div class="so">${nguoi} <span class="nho">người</span> · ${D.nhom.length} <span class="nho">nhóm</span></div>
        <div class="nho">${nhomBat} nhóm đang bật · ${D.nguoi.filter((p) => p.ten_goi).length} người đã đặt tên gọi · ${D.nguoi.filter((p) => p.chan).length} bị chặn</div></div>
    </div>
    <div class="luoi" style="margin-top:14px">
      <div class="the"><h3>Hỏi nhiều nhất</h3>${top.length ? `<table>${top.map((p) => `<tr><td>${esc(p.ten_goi || p.ten_zalo)}</td><td class="nho">bot ${p.bot}</td><td style="text-align:right"><b>${p.so_tin}</b></td></tr>`).join("")}</table>` : `<p class="nho">Chưa có ai nhắn.</p>`}</div>
      <div class="the"><h3>Mới hoạt động</h3>${[...D.nguoi].sort((a, b) => (b.cuoi || 0) - (a.cuoi || 0)).slice(0, 6).map((p) => `<div>${esc(p.ten_goi || p.ten_zalo)} <span class="nho">— ${tg(p.cuoi)}</span></div>`).join("") || `<p class="nho">—</p>`}</div>
      <div class="the"><h3>Bật / tắt gần đây</h3>${(D.su_kien || []).slice(0, 8).map((x) => `<div class="nho" style="padding:2px 0">${/dừng|Mất|Lỗi/i.test(x.msg) ? "🔴" : /kết nối lại/i.test(x.msg) ? "🟡" : "🟢"} <b>${new Date(x.luc).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</b> ${esc(x.msg.replace(/ lúc \d.*?(?=[.(,]|$)/, ""))}</div>`).join("") || `<p class="nho">Chưa có</p>`}</div>
      <div class="the"><h3>🔒 Dữ liệu được mã hoá AES-256</h3><div class="nho">File lưu trên bot và bản sao trên máy mày đều mã hoá <b>AES-256-GCM</b> · đường truyền HTTPS · đăng nhập 2 cấp, mật khẩu băm scrypt · số liệu mật không gửi AI.<br><a href="#luu" class="xem-bm">Xem chi tiết</a></div></div>
    </div>`;
}

// lọc theo bot (0 = tất cả) — dùng chung tab Người dùng / Nhóm
let locBot = 0;
const nutBot = () => { const ds = (D.bot?.bots || []).map((b) => b.so); if (ds.length < 2) return ""; return [0, ...ds].map((so) => `<button class="nut nho ${locBot === so ? "chinh" : ""} chon-bot" data-bot="${so}">${so ? `Bot ${so} · ${esc((D.bot.bots.find((b) => b.so === so) || {}).ten || "")}` : "Tất cả"}</button>`).join(""); };
document.addEventListener("click", (e) => { if (e.target.closest(".xem-bm")) { e.preventDefault(); tab = "luu"; location.hash = "luu"; ve(); return; } const b = e.target.closest(".chon-bot,.loc-bot"); if (!b) return; e.preventDefault(); locBot = Number(b.dataset.bot); if (b.classList.contains("loc-bot")) { tab = "nguoi"; location.hash = "nguoi"; } dangSua = false; ve(); });
const chip = (t, m = "") => `<span class="the-chip ${m}">${t}</span>`;
let locNguoi = "";
function veNguoi() {
  const q = locNguoi.toLowerCase();
  const ds = D.nguoi.filter((p) => (!locBot || p.bot === locBot) && (!q || [p.ten_zalo, p.ten_goi, p.uid, p.ghi_chu].some((x) => String(x || "").toLowerCase().includes(q))))
    .sort((a, b) => (b.cuoi || 0) - (a.cuoi || 0));
  const tenNhom = (id) => D.nhom.find((g) => g.id === id)?.ten || id.slice(0, 10) + "…";
  $('[data-tab=nguoi]').innerHTML = `

      <td>${tenBot(g.bot)}</td><td>${chip(t, m)}</td>
      ${o("q-chat", q.chat, "Trả lời câu hỏi bằng AI")}${o("q-tra", q.tra, "Tra thẻ mã CK, full")}${o("q-cb", q.canh_bao, "Nhận cảnh báo giá")}${o("q-room", room.includes(g.id), "Tra room 9380 (MẬT)")}${o("q-deal", dealN.includes(g.id), "Tra deal / lãi suất (MẬT)")}
      <td>${g.so_tin || 0}</td><td class="nho">${tg(g.cuoi)}${g.nguoi_cuoi ? `<br>${esc(g.nguoi_cuoi)}` : ""}</td>

let locLog = "", tuDong = true;
async function veLog() {
  const s = $('[data-tab=log]');

    s.innerHTML = `<div class="thanh-cong"><select id="l-loai" style="max-width:160px"><option value="">Tất cả</option><option value="loi">Chỉ lỗi / cảnh báo</option><option value="tin">Tin nhắn</option></select>

    $("#l-loai", s).onchange = $("#l-tim", s).oninput = () => veLog();
    $("#l-tu", s).onchange = (e) => { tuDong = e.target.checked; };
  }
  let ds;
  try { ds = (await api("nhat-ky")).dong; } catch (e) { return; }

  h.innerHTML = ds.slice(-500).map((d) => `<div class="${d.m}"><span class="t">${esc(d.t)}</span> ${esc(d.s)}</div>`).join("") || "<span class='t'>(trống)</span>";

}

// ================= NẠP DỮ LIỆU (kéo thả) — bot nhớ, KHÔNG nhắn Zalo =================
let xlsxSan = null;
const napXlsx = () => (xlsxSan ??= new Promise((ok, loi) => { const s = document.createElement("script"); s.src = window.GH ? "xlsx.full.min.js" : "/quan-ly/xlsx.js"; s.onload = () => (window.XLSX ? ok(window.XLSX) : loi(new Error("bộ đọc Excel hỏng"))); s.onerror = () => loi(new Error("không tải được bộ đọc Excel")); document.head.append(s); }).catch((e) => { xlsxSan = null; throw e; }));
const b64 = (ab) => { const u = new Uint8Array(ab); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
let napDang = false;
async function napFile(f) {
  if (napDang) return bao("Đang nạp file khác, chờ chút", true);
  napDang = true;
  const ghi = (m) => { const o = $("#nap-tt"); if (o) o.textContent = m; };
  try {
    let body;
    if (/\.html?$/i.test(f.name)) {
      ghi(`Đang gửi dashboard "${f.name}"… (kiểm + đẩy lên web)`);
      body = { kieu: "dash", ten: f.name, text: await f.text() };
    } else if (/\.xlsx?$/i.test(f.name)) {
      ghi(`Đang đọc "${f.name}" trên máy này…`);
      const ab = await f.arrayBuffer();
      const XLSX = await napXlsx().catch(() => null);
      if (!XLSX) {                                       // máy này không tải được bộ đọc → gửi nguyên file, bot tự đọc
        if (f.size > 22 * 1048576) throw new Error("file quá 22 MB");
        body = { kieu: "xlsx-tho", ten: f.name, base64: b64(ab) };
        ghi("Máy này không đọc được Excel — gửi nguyên file để bot đọc…");
      } else if (XLSX.read(ab, { type: "array", bookSheets: true }).SheetNames.includes("Tổng hợp nhóm")) {
        const wb = XLSX.read(ab, { type: "array", sheets: ["Tổng hợp nhóm", "Tổng quan", "RAW 9385"] });
        const r9 = wb.Sheets["RAW 9385"] ? XLSX.utils.sheet_to_json(wb.Sheets["RAW 9385"], { header: 1, defval: "", raw: true }) : null;
        body = { kieu: "deal", ten: f.name, ...(r9 ? { raw_9385: r9.map((r) => [r[2], r[4]]), ngay_9385: r9[0]?.[3] } : {}),
          rows: XLSX.utils.sheet_to_json(wb.Sheets["Tổng hợp nhóm"], { header: 1, defval: "", raw: true }),
          tong_quan: wb.Sheets["Tổng quan"] ? XLSX.utils.sheet_to_json(wb.Sheets["Tổng quan"], { header: 1, defval: "", raw: false }).slice(0, 5) : [] };
        ghi(`Đã đọc ${body.rows.length - 1} dòng nhóm KH — đang gửi lên bot…`);
      } else {
        if (f.size > 10 * 1048576) throw new Error("file 9380 quá 10 MB");
        body = { kieu: "room", ten: f.name, base64: b64(ab) };
        ghi("Đang gửi file room 9380…");
      }
    } else throw new Error("Chỉ nhận .html (dashboard) hoặc .xls/.xlsx (9380, Deal/Mass)");
    const r = await api("nap-file", body);
    ghi(r.ket_qua); bao("Bot đã nhớ — không nhắn Zalo");
    await tai(); dongBo(D?.kho?.luc || 0, true);
  } catch (e) { ghi("❌ " + e.message); bao(e.message, true); }
  finally { napDang = false; }
}

function ve2FA(khoaMoi) {

      <li>Tên tài khoản: <b>Bot Zalo</b> · Khoá: <code style="font-size:15px;user-select:all">${nhom4(khoaMoi.khoa)}</code> <button class="nut nho" id="g-chep">Chép</button> · Loại: <b>Dựa trên thời gian</b>.<br>
        <span>Mở trang này trên chính điện thoại thì bấm luôn: <a href="${esc(khoaMoi.link)}">Thêm vào Authenticator</a></span></li>
      <li>Nhập mã 6 số app đang hiện để xác nhận:</li></ol>
      <div class="thanh-cong"><input type="text" id="g-ma" inputmode="numeric" maxlength="7" placeholder="123456" style="max-width:140px;font-size:18px;letter-spacing:3px"><button class="nut chinh" id="g-xn">Xác nhận</button> <button class="nut" id="g-huy">Huỷ</button></div><div id="g-kq"></div>`;
    $("#g-chep").onclick = () => navigator.clipboard.writeText(khoaMoi.khoa).then(() => bao("Đã chép khoá"));

    ${(D.tai_khoan || []).map((t) => `<tr data-id="${esc(t.id)}"><td><b>${esc(t.ten)}</b></td><td class="nho">${ngayGio(t.tao_luc)}</td>
      <td class="nho">${t.lan_cuoi ? `${tg(t.lan_cuoi)}<br>${esc(t.ip_cuoi || "")}` : "chưa"}</td><td>${t.khoa ? chip("Đã khoá", "do") : chip("Đang dùng", "xanh")}</td>
      <td style="white-space:nowrap"><button class="nut nho tk-v" data-v="${t.khoa ? "mo" : "khoa"}">${t.khoa ? "Mở" : "Khoá"}</button> <button class="nut nho tk-doi">Đổi mật khẩu</button> <button class="nut nho do tk-v" data-v="xoa">Xoá</button></td></tr>`).join("") || `<tr><td colspan="5" class="nho">Chưa có tài khoản</td></tr>`}
    </tbody></table></div></div>`;
  s.oninput = () => { dangSua = true; };              // đang gõ: không vẽ lại đè mất chữ
  $("#tk-hien", s).onchange = (e) => { $("#tk-mk-nhap", s).type = e.target.checked ? "text" : "password"; };
  const hien = (ten, mk) => { $("#tk-mk", s).innerHTML = `<div class="bao xanh">Mật khẩu của <b>${esc(ten)}</b>: <code style="font-size:16px;user-select:all">${esc(mk)}</code> <button class="nut nho" id="tk-chep">Chép</button><br><span class="nho">Chỉ hiện lần này. Đường dẫn: ${esc(location.origin)}/quan-ly</span></div>`; $("#tk-chep", s).onclick = () => navigator.clipboard.writeText(mk).then(() => bao("Đã chép")); };
  $("#tk-tao", s).onclick = async () => {
    const ten = $("#tk-ten", s).value.trim(), mk = $("#tk-mk-nhap", s).value; if (!ten) return bao("Nhập tên", true);
    dangSua = false;
    try { const r = await api("tai-khoan", { viec: "tao", ten, mat_khau: mk }); await tai(); if (r.mat_khau) hien(ten, r.mat_khau); else bao(`Đã tạo tài khoản ${ten} với mật khẩu mày đặt`); } catch (e) { bao(e.message, true); }
  };
  s.onclick = async (e) => {
    const d = e.target.closest(".tk-doi");
    if (d) {                                       // hiện ô đổi mật khẩu ngay dưới dòng
      const tr = d.closest("tr"); if (tr.nextElementSibling?.classList.contains("tk-o")) return tr.nextElementSibling.remove();
      tr.insertAdjacentHTML("afterend", `<tr class="tk-o"><td colspan="5"><div class="thanh-cong" style="margin:0"><input type="password" class="tk-mk2" placeholder="Mật khẩu mới (trống = bot tự tạo)" autocomplete="new-password" style="max-width:260px"><button class="nut nho chinh tk-luu-mk" data-id="${tr.dataset.id}">Lưu mật khẩu</button><span class="nho">Người đó phải đăng nhập lại bằng mật khẩu mới</span></div></td></tr>`);
      tr.nextElementSibling.querySelector("input").focus(); dangSua = true; return;
    }
    const l = e.target.closest(".tk-luu-mk");
    if (l) {
      const row = l.closest("tr"), tr = row.previousElementSibling, ten = tr.querySelector("b").textContent;
      dangSua = false;
      try { const r = await api("tai-khoan", { viec: "dat-lai", id: l.dataset.id, mat_khau: row.querySelector(".tk-mk2").value }); await tai(); if (r.mat_khau) hien(ten, r.mat_khau); else bao(`Đã đổi mật khẩu cho ${ten}`); } catch (er) { bao(er.message, true); }
      return;
    }
    const b = e.target.closest(".tk-v"); if (!b) return;
    const tr = b.closest("tr"), id = tr.dataset.id, ten = tr.querySelector("b").textContent, v = b.dataset.v;
    if (v === "xoa" && !confirm(`Xoá tài khoản ${ten}?`)) return;
    try { const r = await api("tai-khoan", { viec: v, id }); await tai(); if (r.mat_khau) hien(ten, r.mat_khau); else bao("Xong"); } catch (er) { bao(er.message, true); }
  };
}

// ================= BẢN SAO TRÊN TRÌNH DUYỆT (mã hoá — chỉ bot giải được) =================
// Bot restart (Render xoá ổ đĩa) -> trình duyệt nào mở trang trước sẽ nạp lại. Máy nhà + máy cơ quan: bot gộp, giữ bản MỚI NHẤT từng mục.
const BS = {
  db: () => new Promise((ok, loi) => { const r = indexedDB.open("bot-zalo", 1); r.onupgradeneeded = () => r.result.createObjectStore("bs"); r.onsuccess = () => ok(r.result); r.onerror = () => loi(r.error); }),
  async doc() { try { const db = await BS.db(); return await new Promise((ok) => { const q = db.transaction("bs").objectStore("bs").get("ban_sao"); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch { return null; } },
  async ghi(v) { try { const db = await BS.db(); await new Promise((ok) => { const t = db.transaction("bs", "readwrite"); t.objectStore("bs").put(v, "ban_sao"); t.oncomplete = ok; t.onerror = ok; }); } catch { /* */ } },
};
let bsLayLuc = 0, daDuaLen = false;
async function dongBo(lucBot, ep = false) {
  const cua = await BS.doc();
  // mỗi lần đăng nhập: LUÔN đưa bản sao máy này lên trước (bot gộp, giữ bản mới nhất TỪNG mục) rồi mới lấy bản của bot về.
  // (không so mốc giờ cả kho: bot vừa restart tự ghi tin bật/đếm tin nên trông "mới hơn" dù thiếu VCSH, deal, room…)
  if (cua && !daDuaLen) {
    daDuaLen = true;
    try { const r = await api("khoi-phuc", { blob: cua.blob }); if (r.lay?.length) { bao("Đã đưa số liệu đang giữ trên máy này lên bot: " + r.lay.join(", ")); lucBot = r.luc || lucBot; ep = true; } } catch { /* */ }
  }
  if (ep || !cua || lucBot > cua.luc) {
    if (!ep && Date.now() - bsLayLuc < (window.GH ? 600_000 : 60_000)) return;   // giữ bản sao mới, tối đa 1 lần/phút (GitHub: 10 phút)
    bsLayLuc = Date.now();
    try { const r = await api("ban-sao"); await BS.ghi({ luc: r.luc, blob: r.blob, cat_luc: Date.now() }); } catch { /* */ }
  }
}
async function cuuBotTrong() {                                     // trước khi đăng nhập: bot trống -> nạp lại ngay
  try {
    const t = await (await fetch("/quan-ly/api/tinh-trang", { credentials: "same-origin" })).json();
    const cua = await BS.doc();
    if (t.trong && cua?.blob) {
      const r = await fetch("/quan-ly/api/khoi-phuc", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json", "x-ql": "1" }, body: JSON.stringify({ blob: cua.blob }) });
      if (r.ok) bao("Bot vừa khởi động lại — đã tự nạp lại số liệu từ máy này");
    }
  } catch { /* */ }
}

// ================= CHẠY =================
async function tai() {
  try {
    D = await api(VAI === "chu" ? "du-lieu" : "du-lieu-nhap");
    ve();
    dongBo(D.kho?.luc || 0);
  } catch (e) { if (!/đăng nhập/.test(e.message)) { $("#h-tt").textContent = "Không kết nối được bot"; $("#h-cham").className = "cham off"; } }
}
async function batDau() {
  $("#dangnhap").classList.add("an"); $("#app").classList.remove("an");
  for (const s of document.querySelectorAll("main section")) s.innerHTML = "";   // không giữ gì của phiên trước
  D = null; dangSua = false; daDuaLen = false;
  const ds = VAI === "chu" ? (window.GH ? TABS_CHU.filter(([k]) => k !== "cai") : TABS_CHU) : TABS_NHAP;   // qua GitHub: không sửa cài đặt
  if (!ds.some(([k]) => k === tab)) tab = ds[0][0];
  $("#tabs").innerHTML = ds.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join("");
  for (const id of ["#h-tamdung", "#h-kdl"]) $(id).classList.toggle("an", VAI !== "chu" || (id === "#h-kdl" && !!window.GH));
  await tai();
  clearInterval(hen);
  hen = setInterval(() => { if (document.hidden) return; if (tab === "log") { if (tuDong) veLog(); } else tai(); }, window.GH ? 60_000 : 8000);
}
(async () => {
  if (window.GH) { GH.moTrang(); hienDangNhap(GH.ghi); return; }       // trang GitHub: không gọi thẳng bot
  await cuuBotTrong();
  try {
    const r = await fetch("/quan-ly/api/toi", { credentials: "same-origin" });
    const j = await r.json().catch(() => ({}));
    if (j.chua_mk) { hienDangNhap(j.loi); $("#dn-form").classList.add("an"); return; }
    // MỖI LẦN MỞ / TẢI LẠI TRANG đều phải đăng nhập lại: huỷ phiên cũ (nếu có)
    if (r.ok) await fetch("/quan-ly/api/dang-xuat", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json", "x-ql": "1" }, body: "{}" }).catch(() => {});
    hienDangNhap();
  } catch { hienDangNhap("Không kết nối được bot."); }
})();
</script>
